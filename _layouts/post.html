---
layout: default
---
{%- comment -%}記事。日付の書き方を、記事の言葉(lang)に合わせる{%- endcomment -%}
<article class="post h-entry" lang="{{ page.lang }}">
  <header class="post-header">
    <h1 class="post-title p-name">{{ page.title | escape }}</h1>
    <p class="post-meta"><time class="dt-published" datetime="{{ page.date | date_to_xmlschema }}">{% if page.lang == "en" %}{{ page.date | date: "%B %-d, %Y" }}{% else %}{{ page.date | date: "%Y年%m月%d日" }}{% endif %}</time></p>
  </header>
  <div class="post-content e-content">{{ content }}</div>
</article>
