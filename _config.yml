title: クライミングニュース(試作)
description: 公開されているクライミングのニュースを、AIが毎朝集めて短くまとめます。くわしくは元の記事へ。
lang: ja
timezone: Asia/Tokyo
theme: minima
# 英語版は en/_posts に置き、/en/年/月/日/ になる(日本語版は今まで通り /年/月/日/)
permalink: /:categories/:year/:month/:day/
show_excerpts: true
minima:
  date_format: "%Y年%m月%d日"
exclude:
  - GUIDE.md
  - GUIDE_EN.md
  - README.md

# 日本語版と英語版を分ける(トップの一覧は、そのページと同じ言葉の記事だけ)
defaults:
  - scope:
      path: ""
    values:
      lang: ja
  - scope:
      path: "en"
    values:
      lang: en
